spring.application.name=gateway-service
server.port=8080
spring.config.import=optional:configserver:http://config-service:8888
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.client.service-url.defaultZone=http://discovery-service:8761/eureka/
spring.cloud.config.profile=dev
spring.cloud.config.uri=http://config-service:8888
spring.cloud.loadbalancer.ribbon.enabled=false

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true


spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://auth-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=booking-service
spring.cloud.gateway.routes[1].uri=lb://BOOKINGSERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/booking/**

spring.cloud.gateway.routes[2].id=CUSTOMERSERVICE
spring.cloud.gateway.routes[2].uri=http://CUSTOMERSERVICE:9091
spring.cloud.gateway.routes[2].predicates[0]=Path=/customer/**
spring.cloud.gateway.routes[2].filters[0]=JwtValidationFilter

spring.cloud.gateway.routes[3].id=user-service
spring.cloud.gateway.routes[3].uri=http://USER-SERVICE:9093
spring.cloud.gateway.routes[3].predicates[0]=Path=/users/**


spring.cloud.gateway.routes[4].id=client-service
spring.cloud.gateway.routes[4].uri=lb://CLIENT-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/abm-clientes/**



eureka.client.healthcheck.enabled=true
eureka.instance.leaseRenewalIntervalInSeconds=30
eureka.instance.leaseExpirationDurationInSeconds=90





